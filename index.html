<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0b0f1a" />
    <meta name="description" content="AirWheel — 3D-гонка (GT3 и F1, шесть трасс, погода и пит-стопы, мультиплеер по коду), которой управляешь руками через веб-камеру, как рулём." />
    <title>AirWheel — руль из воздуха</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏎️</text></svg>" />
  </head>
  <body>
    <canvas id="game"></canvas>

    <!-- Превью камеры: зеркальное видео + скелет рук -->
    <div id="cam-box" class="cam-box">
      <video id="video" playsinline muted autoplay></video>
      <canvas id="cam-canvas"></canvas>
      <div id="cam-status" class="cam-status">Камера выключена</div>
    </div>

    <div class="topbar">
      <button id="btn-cam" class="icon-btn" title="Камера (C)" aria-label="Сменить камеру">🎥</button>
      <button id="btn-kb" class="icon-btn" title="Клавиатура (K)" aria-label="Переключить клавиатуру">⌨️</button>
      <button id="btn-mute" class="icon-btn" title="Звук (M)" aria-label="Звук">🔊</button>
      <button id="btn-pause" class="icon-btn" title="Пауза (Esc)" aria-label="Пауза">⏸</button>
    </div>

    <!-- Подсказка коуча (режим «Ошибка») -->
    <div id="coach" class="coach" aria-live="polite"></div>

    <div id="hud"></div>

    <div id="screen" class="screen hidden"></div>

    <!-- Тач-кнопки для клавиатурного режима на телефоне -->
    <div id="touch" class="touch">
      <div class="touch-left">
        <button data-k="left" aria-label="Влево">◀</button>
        <button data-k="right" aria-label="Вправо">▶</button>
      </div>
      <div class="touch-right">
        <button data-k="nitro" class="nitro" aria-label="Ускорение Boost/ERS">⚡</button>
        <button data-k="brake" class="brake" aria-label="Тормоз">ТОРМОЗ</button>
        <button data-k="gas" class="gas" aria-label="Газ">ГАЗ</button>
      </div>
    </div>

    <div id="rotate" class="rotate">
      <div>📱↻</div>
      <p>Поверни телефон горизонтально — так руль помещается в кадр.</p>
    </div>

    <pre id="debug" class="debug hidden"></pre>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
